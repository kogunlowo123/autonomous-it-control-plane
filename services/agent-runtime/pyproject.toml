[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-it-agent-runtime"
version = "0.1.0"
description = "Autonomous IT Control Plane Agent Runtime — LangGraph-based AI agents"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "litellm>=1.40.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sentence-transformers>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "opensearch-py>=2.5.0",
    "httpx>=0.27.0",
    "opentelemetry-sdk>=1.24.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "types-psycopg2>=2.9.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
