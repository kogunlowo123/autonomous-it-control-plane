[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-it-rag-core"
version = "0.1.0"
description = "Autonomous IT Control Plane RAG Core — document ingestion, chunking, and retrieval"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "opensearch-py>=2.5.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pypdf>=4.2.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
