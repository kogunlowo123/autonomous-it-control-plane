name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
  push:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.8.5"
  TF_ENV: "dev"
  AWS_REGION: "us-east-1"

jobs:
  terraform-check:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/

      - name: Terraform Init (dev)
        run: terraform -chdir=infra/envs/aws/${{ env.TF_ENV }} init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=infra/envs/aws/${{ env.TF_ENV }} validate

  terraform-plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: terraform-check
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          aws-role-arn: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=infra/envs/aws/${{ env.TF_ENV }} init

      - name: Terraform Plan
        id: plan
        run: |
          terraform -chdir=infra/envs/aws/${{ env.TF_ENV }} plan \
            -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: terraform-check
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          aws-role-arn: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=infra/envs/aws/${{ env.TF_ENV }} init

      - name: Terraform Apply
        run: terraform -chdir=infra/envs/aws/${{ env.TF_ENV }} apply -auto-approve
