apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: itsm-api-secrets
  namespace: itsm-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: itsm/database
        property: url
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: itsm/jwt
        property: secret_key
    - secretKey: OPA_URL
      remoteRef:
        key: itsm/opa
        property: url

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: itsm-agent-runtime-secrets
  namespace: itsm-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: agent-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: itsm/database
        property: url
    - secretKey: INCIDENT_QUEUE_URL
      remoteRef:
        key: itsm/sqs
        property: incident_queue_url
    - secretKey: CHANGE_EVENTS_QUEUE_URL
      remoteRef:
        key: itsm/sqs
        property: change_events_queue_url
