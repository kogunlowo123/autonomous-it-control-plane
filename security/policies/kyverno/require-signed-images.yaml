apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >
      All container images in the autonomous-it-control-plane namespace must be
      cryptographically signed with cosign. Unsigned images are rejected.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - itsm-system
      verifyImages:
        - imageReferences:
            - "*.dkr.ecr.*.amazonaws.com/autonomous-it-*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/kogunlowo123/autonomous-it-control-plane/.github/workflows/release.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
